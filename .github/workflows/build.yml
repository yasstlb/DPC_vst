name: Build plugin

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -A x64 -DJUCE_BUILD_EXTRAS=OFF -DJUCE_BUILD_EXAMPLES=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target DPC_vst_VST3

      - name: Upload VST3 build
        uses: actions/upload-artifact@v4
        with:
          name: DPC-vst3-windows
          path: build/DPC_vst_artefacts/Release/VST3/DPC.vst3
          if-no-files-found: error
          retention-days: 14
